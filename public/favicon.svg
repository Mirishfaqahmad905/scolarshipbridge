<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a" />
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="url(#sbGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Bridge Arc (Connecting worldwide opportunities) -->
  <path d="M 12 44 Q 32 26 52 44" fill="none" stroke="url(#sbGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 16 46 Q 32 32 48 46" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8" />

  <!-- Academic Cap Diamond -->
  <polygon points="32,14 50,22 32,30 14,22" fill="url(#goldGrad)" filter="url(#shadow)" />
  
  <!-- Cap Skull Base -->
  <path d="M 22 26 L 22 33 C 22 38 42 38 42 33 L 42 26" fill="#d97706" />

  <!-- Tassel -->
  <path d="M 44 24.5 L 48 34" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
  <circle cx="48" cy="35" r="2" fill="#fef08a" />

  <!-- Central Star of Excellence -->
  <polygon points="32,36 33.5,39.5 37,40 34.5,42.5 35,46 32,44 29,46 29.5,42.5 27,40 30.5,39.5" fill="#38bdf8" />
</svg>
